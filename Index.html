<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS AI</title>
<style>
:root{--bg:#050b15;--pn:#0a1725;--ln:#16445a;--ac:#00eaff;--ok:#00ffad;--tx:#e8faff;--mu:#91b5c6;--bt:#06394a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.logo{color:var(--ac);font-size:22px;font-weight:700;letter-spacing:4px}
nav{display:flex;gap:6px}
nav a{color:var(--mu);text-decoration:none;padding:8px 14px;border:1px solid var(--ln);border-radius:8px;font-size:14px}
nav a.on{background:var(--bt);color:var(--ac);border-color:#08758b}
.status{color:var(--ok);font-size:12px}
.wrap{max-width:980px;margin:auto;padding:16px}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
h3{color:var(--ac);margin:0 0 10px;font-size:17px}
input,select,textarea{width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;min-height:44px;padding:11px;background:#07111d;color:var(--tx);border:1px solid #24516a;border-radius:8px;margin:5px 0;font:inherit}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
button{background:var(--bt);color:var(--ac);border:1px solid #08758b;padding:10px 14px;border-radius:8px;cursor:pointer;margin:3px;font:inherit}
button:hover{background:#07536a}button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.small{font-size:12.5px;color:var(--mu)}
.on-t{color:var(--ok)}
#chat{height:min(58vh,520px);overflow-y:auto;padding:10px;background:#050d17;border-radius:9px;margin:10px 0}
.msg{padding:11px 13px;margin:8px 0;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.user{background:#10344a;margin-left:10%}
.bot{background:#10221f;margin-right:10%;border:1px solid #145348}
.msg pre{background:#030a12;padding:10px;border-radius:7px;overflow-x:auto;margin:6px 0}
.msg code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.cp{font-size:11px;padding:3px 8px;margin:6px 0 0;display:block}
.src{border-bottom:1px solid #1c3a4d;padding:10px 0}
.src a{color:var(--ac);font-weight:600}
.src p{margin:4px 0 0}
.rem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1c3a4d;padding:8px 0;gap:8px}
#preview{max-width:140px;max-height:110px;display:none;margin:6px 0;border-radius:6px}
footer{text-align:center;color:#537789;padding:18px;font-size:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.user{margin-left:4%}.bot{margin-right:4%}.logo{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
 <div class="logo">J.A.R.V.I.S</div>
 <nav><a href="#home" data-p="home">🏠 Home</a><a href="#chat" data-p="chat">🤖 Chat</a><a href="#search" data-p="search">🌐 Search</a></nav>
 <div class="status" id="status">● SYSTEM READY</div>
</header>

<main class="wrap">

<!-- ============ PAGE 1: HOME ============ -->
<section id="page-home">
 <div class="panel">
  <h3>🕒 System Clock</h3>
  <div id="clock" style="font-size:30px;color:var(--ac)">--:--:--</div>
  <div id="date" class="small"></div>
 </div>

 <div class="grid">
  <div class="panel">
   <h3>⏰ Smart Reminder</h3>
   <input id="remText" placeholder="Reminder name">
   <input type="datetime-local" id="remTime">
   <button onclick="addReminder()">+ Add Reminder</button>
   <div id="reminders"></div>
  </div>
  <div class="panel">
   <h3>🖥️ Quick Tools</h3>
   <div class="row">
    <button onclick="location.hash='#chat'">Open Chat</button>
    <button onclick="location.hash='#search'">Open Search</button>
    <button onclick="tellTime()">Tell Time</button>
    <button onclick="testAPI()">Test Connection</button>
    <button onclick="window.open('https://openrouter.ai/models?max_price=0','_blank')">Free Models ↗</button>
   </div>
   <p class="small" id="timeSay"></p>
  </div>
 </div>
</section>

<!-- ============ PAGE 2: CHAT ============ -->
<section id="page-chat" hidden>
 <div class="panel">
  <h3>⚙️ AI Model</h3>
  <select id="model"><option value="">Loading free models...</option></select>
  <div class="row">
   <button onclick="loadModels()">↻ Refresh Models</button>
   <button id="speechBtn" onclick="toggleSpeech()">🔊 Voice ON</button>
   <label class="small" style="margin-left:6px"><input type="checkbox" id="useWeb">Web search সহ উত্তর</label>
  </div>
  <p class="small" id="modelInfo"></p>
 </div>

 <div class="panel">
  <h3>🤖 JARVIS Chat</h3>
  <div id="chat"></div>
  <textarea id="prompt" rows="3" placeholder="JARVIS-কে কিছু জিজ্ঞেস করো... (Enter = Send, Shift+Enter = নতুন লাইন)"></textarea>
  <div class="row">
   <button id="sendBtn" onclick="sendMessage()">➤ Send</button>
   <button onclick="startVoice()">🎤 Speak</button>
   <button onclick="stopVoice()">⏹ Stop</button>
   <button onclick="$('file').click()">📎 File</button>
   <button onclick="clearChat()">🗑 Clear</button>
   <select id="vlang" style="width:auto"><option value="bn-BD">বাংলা</option><option value="en-US">English</option></select>
  </div>
  <input type="file" id="file" accept="image/*,.txt,.pdf" hidden>
  <div id="fileInfo" class="small"></div><img id="preview" alt="">
  <p class="small" id="voiceStatus">Voice standby</p>
 </div>
</section>

<!-- ============ PAGE 3: SEARCH ============ -->
<section id="page-search" hidden>
 <div class="panel">
  <h3>🌐 Internet Search</h3>
  <input id="webQuery" placeholder="ইন্টারনেটে কী খুঁজতে চাও?">
  <div class="row">
   <select id="slang" style="width:auto"><option value="auto">Auto ভাষা</option><option value="bn">বাংলা</option><option value="en">English</option></select>
   <button onclick="performSearch()">🔍 Search</button>
   <button onclick="summarize()" id="sumBtn">✨ AI Summary</button>
  </div>
  <p class="small" id="webStatus">Wikipedia দিয়ে সার্চ হয়।</p>
  <div id="sumBox" class="msg bot" hidden></div>
  <div id="webResults"></div>
 </div>
</section>

</main>
<footer>JARVIS AI • Free Model Edition • OpenRouter</footer>

<script>
// ======= নিজের API Key এখানে বসাও (quotes-এর ভেতরে) =======
const OPENROUTER_API_KEY = "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";
// ==========================================================
const $=id=>document.getElementById(id);
const API="https://openrouter.ai/api/v1", DEFAULT_MODEL="openai/gpt-oss-20b:free";
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md=t=>esc(t).replace(/```\w*\n?([\s\S]*?)```/g,"<pre><code>$1</code></pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
const setStatus=t=>$("status").textContent="● "+t;
const getKey=()=>OPENROUTER_API_KEY.trim();

let history=store.get("jv_hist",[]), speechOn=store.get("jv_speech",true), busy=false, recognition=null, file=null;
let lastResults=[], lastQuery="";

/* ---------- Router ---------- */
function route(){
 const p=["home","chat","search"].includes(location.hash.slice(1))?location.hash.slice(1):"home";
 ["home","chat","search"].forEach(id=>{$("page-"+id).hidden=id!==p});
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
 if(p==="chat"&&!$("model").dataset.loaded&&getKey())loadModels();
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);

/* ---------- Key ---------- */
function needKey(){if(getKey())return true;alert("কোডের শুরুতে OPENROUTER_API_KEY-তে তোমার Key বসাও।");return false}
async function testAPI(){
 if(!needKey())return;
 try{setStatus("TESTING");const r=await fetch(API+"/auth/key",{headers:{Authorization:"Bearer "+getKey()}});
  if(!r.ok)throw new Error("Key কাজ করছে না ("+r.status+")");setStatus("CONNECTED");alert("JARVIS connected!")}
 catch(e){setStatus("ERROR");alert(e.message)}
}

/* ---------- Models ---------- */
async function loadModels(){
 if(!needKey())return;
 try{
  setStatus("LOADING MODELS");$("modelInfo").textContent="Loading...";
  const r=await fetch(API+"/models",{headers:{Authorization:"Bearer "+getKey()}});
  const d=await r.json();if(!r.ok)throw new Error(d.error?.message||"Model loading failed");
  const free=(d.data||[]).filter(m=>m.id.endsWith(":free")||(Number(m.pricing?.prompt)===0&&Number(m.pricing?.completion)===0)).sort((a,b)=>a.id.localeCompare(b.id));
  if(!free.length)throw new Error("কোনো Free Model পাওয়া যায়নি।");
  const sel=$("model"),prev=store.get("jv_model",DEFAULT_MODEL);sel.innerHTML="";
  free.forEach(m=>{const o=document.createElement("option");o.value=m.id;o.textContent=m.name+" ("+m.id.split("/")[0]+")";sel.appendChild(o)});
  sel.value=free.some(m=>m.id===prev)?prev:free[0].id;sel.dataset.loaded="1";
  $("modelInfo").textContent=free.length+" Free Models Available";setStatus("MODELS READY");
 }catch(e){setStatus("MODEL ERROR");$("modelInfo").textContent=e.message}
}
$("model").addEventListener("change",()=>{store.set("jv_model",$("model").value);$("modelInfo").textContent="Selected: "+$("model").selectedOptions[0].textContent});

/* ---------- Wikipedia search ---------- */
async function wikiSearch(q){
 const lang=$("slang").value==="auto"?(/[\u0980-\u09FF]/.test(q)?"bn":"en"):$("slang").value;
 const api="https://"+lang+".wikipedia.org/w/api.php";
 const u=new URL(api);u.search=new URLSearchParams({action:"query",list:"search",srsearch:q,srlimit:"5",format:"json",origin:"*"});
 const r=await fetch(u);if(!r.ok)throw new Error("Search connection failed");
 const hits=(await r.json()).query?.search||[];if(!hits.length)return[];
 const u2=new URL(api);u2.search=new URLSearchParams({action:"query",pageids:hits.map(h=>h.pageid).join("|"),prop:"extracts",exintro:"1",explaintext:"1",exsentences:"6",format:"json",origin:"*"});
 const r2=await fetch(u2);if(!r2.ok)throw new Error("Article loading failed");
 const pages=(await r2.json()).query?.pages||{};
 return hits.map(h=>({title:h.title,text:pages[h.pageid]?.extract||"",url:"https://"+lang+".wikipedia.org/?curid="+h.pageid}));
}
async function performSearch(){
 const q=$("webQuery").value.trim();if(!q){alert("কী সার্চ করবে লিখো");return}
 $("webStatus").textContent="Searching...";$("webResults").innerHTML="";$("sumBox").hidden=true;
 try{
  lastResults=await wikiSearch(q);lastQuery=q;
  if(!lastResults.length){$("webStatus").textContent="কোনো তথ্য পাওয়া যায়নি।";return}
  lastResults.forEach(it=>{
   const b=document.createElement("div");b.className="src";
   const a=document.createElement("a");a.href=it.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=it.title;
   const p=document.createElement("p");p.className="small";p.textContent=it.text;
   b.append(a,p);$("webResults").appendChild(b);
  });
  $("webStatus").textContent="✓ "+lastResults.length+" টি ফলাফল";
 }catch(e){$("webStatus").textContent="Search Error: "+e.message}
}
$("webQuery").addEventListener("keydown",e=>{if(e.key==="Enter")performSearch()});
function ctxFrom(rs){return "\n\nWEB SEARCH INFORMATION:\n"+rs.map((x,i)=>"Source "+(i+1)+": "+x.title+"\n"+x.text+"\n"+x.url).join("\n\n")+"\n\nএই তথ্যের ভিত্তিতে উত্তর দাও। যা তথ্যে নেই তা বানিয়ে বলবে না। প্রাসঙ্গিক সোর্সের লিংক দেবে."}

async function callAI(messages){
 const r=await fetch(API+"/chat/completions",{method:"POST",headers:{Authorization:"Bearer "+getKey(),"Content-Type":"application/json","X-OpenRouter-Title":"JARVIS AI"},
  body:JSON.stringify({model:$("model").value||store.get("jv_model",DEFAULT_MODEL),messages,temperature:0.7,max_tokens:2000})});
 const d=await r.json();if(!r.ok)throw new Error(d.error?.message||"Model request failed");
 const a=d.choices?.[0]?.message?.content;if(!a)throw new Error("No response received");return a;
}
async function summarize(){
 if(!lastResults.length){alert("আগে সার্চ করো");return}
 if(!needKey())return;
 const box=$("sumBox");box.hidden=false;box.textContent="JARVIS সারাংশ তৈরি করছে...";$("sumBtn").disabled=true;
 try{
  const a=await callAI([{role:"system",content:"You are JARVIS. Answer in the user's language, concise and accurate."},{role:"user",content:"প্রশ্ন: "+lastQuery+ctxFrom(lastResults)}]);
  box.innerHTML=md(a);
 }catch(e){box.textContent="Error: "+e.message}
 $("sumBtn").disabled=false;
}

/* ---------- Chat ---------- */
function addMsg(text,who,save){
 const d=document.createElement("div");d.className="msg "+who;
 if(who==="bot"){d.innerHTML=md(text);const b=document.createElement("button");b.className="cp";b.textContent="Copy";
  b.onclick=()=>{navigator.clipboard?.writeText(text).then(()=>{b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy",1200)}).catch(()=>{})};d.appendChild(b)}
 else d.textContent=text;
 $("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;return d;
}
function renderHistory(){
 $("chat").innerHTML="";
 if(!history.length)addMsg("Hello! আমি JARVIS। কীভাবে সাহায্য করতে পারি?","bot");
 history.forEach(h=>addMsg(h.text,h.role==="user"?"user":"bot"));
}
function clearChat(){history=[];store.set("jv_hist",[]);renderHistory()}
$("file").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;file=f;$("fileInfo").textContent="Selected: "+f.name;
 if(f.type.startsWith("image/")){$("preview").src=URL.createObjectURL(f);$("preview").style.display="block"}else $("preview").style.display="none";
});
const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error("File reading failed"));r.readAsDataURL(f)});

async function sendMessage(){
 if(busy||!needKey())return;
 const prompt=$("prompt").value.trim();
 if(!prompt&&!file){return}
 if(!$("model").value){alert("প্রথমে একটি Model নির্বাচন করো।");return}
 busy=true;$("sendBtn").disabled=true;setStatus("THINKING");
 const userText=prompt||"Please analyze this file: "+file.name;
 addMsg(userText,"user");$("prompt").value="";
 const wait=addMsg("…","bot");
 try{
  let content=userText;
  if(file){
   if(file.size>8*1024*1024)throw new Error("ফাইল 8 MB-এর ছোট রাখো।");
   if(file.type.startsWith("image/"))content=[{type:"text",text:userText},{type:"image_url",image_url:{url:await readURL(file)}}];
   else if(file.type==="application/pdf")content=[{type:"text",text:userText},{type:"file",file:{filename:file.name,file_data:await readURL(file)}}];
   else content=userText+"\n\nFILE CONTENT:\n"+await file.text();
  }
  if(prompt&&$("useWeb").checked){
   $("slang").value="auto";
   try{const rs=await wikiSearch(prompt);if(rs.length){const c=ctxFrom(rs);Array.isArray(content)?content.push({type:"text",text:c}):content+=c}}catch(e){}
  }
  const past=history.slice(-20).map(h=>({role:h.role,content:h.text}));
  const answer=await callAI([{role:"system",content:"You are JARVIS, an intelligent and helpful AI assistant. Answer in the language used by the user. Be friendly, accurate and clear. Never pretend you performed an action you did not perform."},...past,{role:"user",content}]);
  history.push({role:"user",text:userText},{role:"assistant",text:answer});store.set("jv_hist",history.slice(-60));
  wait.remove();addMsg(answer,"bot");if(speechOn)speak(answer);
  file=null;$("file").value="";$("fileInfo").textContent="";$("preview").style.display="none";setStatus("SYSTEM ONLINE");
 }catch(e){wait.remove();addMsg("Error: "+e.message,"bot");setStatus("ERROR")}
 busy=false;$("sendBtn").disabled=false;
}
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});

/* ---------- Voice ---------- */
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Voice recognition-এর জন্য Chrome ব্যবহার করো।");return}
 recognition=new SR();recognition.lang=$("vlang").value;recognition.interimResults=false;
 recognition.onstart=()=>$("voiceStatus").textContent="Listening...";
 recognition.onresult=e=>{$("prompt").value=e.results[0][0].transcript;$("voiceStatus").textContent="Voice captured";sendMessage()};
 recognition.onerror=e=>$("voiceStatus").textContent="Voice error: "+e.error;
 recognition.onend=()=>{if($("voiceStatus").textContent==="Listening...")$("voiceStatus").textContent="Voice standby"};
 recognition.start();
}
function stopVoice(){recognition?.stop();speechSynthesis.cancel();$("voiceStatus").textContent="Voice stopped"}
function speak(t){if(!speechOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g," code block ").replace(/[*`#]/g,""));u.lang=$("vlang").value;speechSynthesis.speak(u)}
function toggleSpeech(){speechOn=!speechOn;store.set("jv_speech",speechOn);paintSpeech();if(!speechOn)speechSynthesis.cancel()}
function paintSpeech(){$("speechBtn").textContent=speechOn?"🔊 Voice ON":"🔇 Voice OFF"}

/* ---------- Clock & tools ---------- */
function tick(){const n=new Date();$("clock").textContent=n.toLocaleTimeString();$("date").textContent=n.toLocaleDateString("bn-BD",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
setInterval(tick,1000);tick();
function tellTime(){const t="এখন সময় "+new Date().toLocaleTimeString("bn-BD");$("timeSay").textContent=t;if(speechOn)speak(t)}

/* ---------- Reminders (saved) ---------- */
let rems=store.get("jv_rem",[]);
function fire(r){
 alert("JARVIS REMINDER: "+r.name);
 if("Notification" in window&&Notification.permission==="granted")new Notification("JARVIS Reminder",{body:r.name});
 if(speechOn)speak("Reminder: "+r.name);r.done=true;store.set("jv_rem",rems);renderRems();
}
function schedule(r){const d=new Date(r.time).getTime()-Date.now();if(r.done||d<=0||d>2147480000)return;setTimeout(()=>fire(r),d)}
async function addReminder(){
 const name=$("remText").value.trim(),time=$("remTime").value;
 if(!name||!time){alert("নাম ও সময় দাও");return}
 const d=new Date(time).getTime()-Date.now();
 if(d<=0){alert("ভবিষ্যতের সময় দাও");return}
 if(d>2147480000){alert("২৪ দিনের মধ্যের সময় দাও");return}
 if("Notification" in window&&Notification.permission==="default")await Notification.requestPermission();
 const r={id:Date.now(),name,time,done:false};rems.push(r);store.set("jv_rem",rems);schedule(r);renderRems();
 $("remText").value="";$("remTime").value="";
}
function renderRems(){
 const box=$("reminders");box.innerHTML="";
 rems.forEach(r=>{
  const d=document.createElement("div");d.className="rem";
  const s=document.createElement("span");s.textContent=(r.done?"✓ ":"⏰ ")+r.name+" — "+r.time.replace("T"," ");
  const b=document.createElement("button");b.textContent="✕";b.setAttribute("aria-label","Delete reminder");
  b.onclick=()=>{rems=rems.filter(x=>x.id!==r.id);store.set("jv_rem",rems);renderRems()};
  d.append(s,b);box.appendChild(d);
 });
}

/* ---------- Init ---------- */
paintSpeech();renderHistory();renderRems();rems.forEach(schedule);route();
</script>
</body>
</html>
